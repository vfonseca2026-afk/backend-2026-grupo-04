# PostgreSQL para desarrollo. Usa los mismos valores que tu archivo .env.
#   docker compose up -d      -> levanta la base
#   docker compose down       -> la detiene (los datos se conservan en el volumen)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata_resenas:/var/lib/postgresql/data

volumes:
  pgdata_resenas:
